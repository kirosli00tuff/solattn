[project]
name = "solattn"
version = "0.1.0"
description = "Evaluation-only measurement of whether social attention velocity predicts forward outcomes on a birth-ordered Solana token universe. Does not trade; no execution path."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "telethon>=1.36",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solattn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# RUF001: the multiplication sign and other typographic characters are
# DELIBERATE here - these strings must match REGISTRATION.md byte-for-byte,
# and "fixing" them would break the drift check they exist to perform.
"tests/test_registration.py" = ["RUF001"]
"solattn/verify.py" = ["RUF001"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["solattn", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["telethon.*", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
